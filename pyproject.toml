[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-agent-benchmark"
version = "0.1.0"
description = "Benchmark for temporal navigation in long-lived agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tab-bench = "harness.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Real-model runs (provider "anthropic"); the harness core and contestants are stdlib-only.
anthropic = ["anthropic>=0.70"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
